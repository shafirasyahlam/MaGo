<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <div class="circle1-login">
        <p>Welcome!</p>
    </div>
    <div class="circle2-login"></div>
    <div class="footer-login">
        <p>Don't have an Account <span class="tosignup">SIGN UP</span></p>
    </div>
    <div class="login-div">
        <div class="input">
            <input class="textfield-login" type="text" placeholder="Username">
        </div>
        <div class="input">
            <input class="textfield-login" type="text" placeholder="Password">
        </div>
        <div class="forgot-login">
            <p>Forgot Password?</p>
        </div>
        <div>
            <button class="login-btn">LOGIN</button>
        </div>
    </div>
</body>
</html>
