<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signin-page.css">
</head>
<body>
    <div class="title">
        <p>&lt;</p>
        <p>Create Account</p>
    </div>
    <div class="footer-signin">
        <p>Already have an Account? <span class="tologin">LOGIN</span></p>
    </div>
    <div class="signin-div">
        <div class="input">
            <input class="textfield-signin" type="text" placeholder="Nama">
        </div>
        <div class="input">
            <input class="textfield-signin" type="text" placeholder="Username">
        </div>
        <div class="input">
            <input class="textfield-signin" type="text" placeholder="Password">
        </div>
        <div class="input">
            <input class="textfield-signin" type="text" placeholder="Confirm Password">
        </div>
        <div>
            <button class="signin-btn">SIGN-IN</button>
        </div>
    </div>
    <div class="circle2-signin"></div>
</body>
</html>
