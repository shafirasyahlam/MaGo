<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Profile Page</title>
</head>
<body>
    <div class="circle1-profile"></div>
    <div class="circle2-profile"></div>
    <div class="hello">
        <p>&lt;</p>
        <p>Hello!</p>
    </div>
    <div class="profile-page">
        <div class="info">
            <p>Your Profile</p>
            <div class="profile-photo">
                <img src=" src\Generic avatar.png" alt="">
            </div>
            <button class="profile-btn">SAVE</button>
            <button class="profile-btn">EDIT</button>
        </div>
        <div class="biodata">
            <div class="input">
                <p>Nama Lengkap</p>
                <input class="textfield-biodata" type="text" placeholder="">
            </div>
            <div class="input">
                <p>NIM</p>
                <input class="textfield-biodata" type="text" placeholder="">
            </div>
            <div class="input">
                <p>Tempat, Tanggal Lahir</p>
                <input class="textfield-biodata" type="text" placeholder="">
            </div>
            <div class="input">
                <p>No Telepon</p>
                <input class="textfield-biodata" type="text" placeholder="">
            </div>
            <div class="input">
                <p>Kesukaan</p>
                <input class="textfield-biodata" type="text" placeholder="">
            </div>
            <div class="input">
                <p>Alamat</p>
                <input class="textfield-biodata" type="text" placeholder="">
            </div>
        </div>
    </div>

</body>
</html>
